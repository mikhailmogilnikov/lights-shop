openapi: 3.1.0
info:
  title: Admin Panel API
  version: 1.0.0
  description: API документация для админской панели магазина освещения

servers:
  - url: http://localhost:8080/api
    description: Development server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT токен для авторизации в админской панели

  schemas:
    Product:
      type: object
      required:
        - id
        - name
        - price
        - imageUrl
        - stockQuantity
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        price:
          type: number
          minimum: 0
        imageUrl:
          type: string
          format: uri
        stockQuantity:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateProduct:
      type: object
      required:
        - name
        - price
        - imageUrl
        - stockQuantity
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        price:
          type: number
          minimum: 0
        imageUrl:
          type: string
          format: uri
        stockQuantity:
          type: integer
          minimum: 0
        category:
          type: string

    UpdateProduct:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        price:
          type: number
          minimum: 0
        imageUrl:
          type: string
          format: uri
        stockQuantity:
          type: integer
          minimum: 0
        category:
          type: string

    OrderStatus:
      type: string
      enum:
        - PENDING
        - PROCESSING
        - SHIPPED
        - DELIVERED
        - CANCELLED

    OrderItem:
      type: object
      required:
        - id
        - orderId
        - productId
        - quantity
        - price
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        price:
          type: number
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Order:
      type: object
      required:
        - id
        - customerName
        - customerLastName
        - customerEmail
        - customerAddress
        - customerCity
        - customerCountry
        - customerZip
        - status
        - totalAmount
        - items
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        customerName:
          type: string
        customerLastName:
          type: string
        customerEmail:
          type: string
          format: email
        customerAddress:
          type: string
        customerCity:
          type: string
        customerCountry:
          type: string
        customerZip:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        totalAmount:
          type: number
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateOrderStatus:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'

    AdminRole:
      type: string
      enum:
        - ADMIN
        - SUPER_ADMIN

    Admin:
      type: object
      required:
        - id
        - email
        - name
        - role
        - isActive
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/AdminRole'
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6

    LoginResponse:
      type: object
      required:
        - success
        - token
        - user
      properties:
        success:
          type: boolean
        token:
          type: string
        user:
          $ref: '#/components/schemas/Admin'

    CreateAdmin:
      type: object
      required:
        - email
        - password
        - name
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        name:
          type: string
          minLength: 1
        role:
          $ref: '#/components/schemas/AdminRole'

    UpdateAdmin:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
        role:
          $ref: '#/components/schemas/AdminRole'
        isActive:
          type: boolean

    Dashboard:
      type: object
      required:
        - totalOrders
        - pendingOrders
        - processingOrders
        - completedOrders
        - cancelledOrders
        - totalRevenue
        - recentOrders
      properties:
        totalOrders:
          type: integer
        pendingOrders:
          type: integer
        processingOrders:
          type: integer
        completedOrders:
          type: integer
        cancelledOrders:
          type: integer
        totalRevenue:
          type: number
        recentOrders:
          type: array
          items:
            $ref: '#/components/schemas/Order'

    DecreaseStock:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type: integer
          minimum: 1

    StockResponse:
      type: object
      required:
        - inStock
      properties:
        inStock:
          type: boolean

    DecreaseStockResponse:
      type: object
      required:
        - success
        - newStockQuantity
      properties:
        success:
          type: boolean
        newStockQuantity:
          type: integer

    SuccessResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
        message:
          type: string

    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
        message:
          type: string

paths:
  # Admin Authentication
  /admin/auth/login:
    post:
      summary: Вход в админскую панель
      tags:
        - Admin Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешная авторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Неверные учетные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/auth/verify:
    get:
      summary: Проверить JWT токен
      tags:
        - Admin Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Токен действителен
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/Admin'
        '401':
          description: Недействительный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/auth/create-admin:
    post:
      summary: Создать нового администратора (только для SUPER_ADMIN)
      tags:
        - Admin Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdmin'
      responses:
        '201':
          description: Администратор успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        '400':
          description: Неверные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав (требуется SUPER_ADMIN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Admin Dashboard
  /admin/dashboard:
    get:
      summary: Получить данные дашборда
      tags:
        - Admin Dashboard
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Данные дашборда
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '401':
          description: Нет доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Admin Product Management
  /admin/products:
    get:
      summary: Получить список всех продуктов (админка)
      tags:
        - Admin Products
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список продуктов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '401':
          description: Нет доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Создать новый продукт
      tags:
        - Admin Products
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProduct'
      responses:
        '201':
          description: Продукт успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Неверные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Получить продукт по ID (админка)
      tags:
        - Admin Products
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Продукт найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Продукт не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Обновить продукт
      tags:
        - Admin Products
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProduct'
      responses:
        '200':
          description: Продукт успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Продукт не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Удалить продукт
      tags:
        - Admin Products
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Продукт успешно удален
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Продукт не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/products/{id}/stock/{quantity}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: quantity
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
    get:
      summary: Проверить наличие продукта на складе
      tags:
        - Admin Products
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Результат проверки наличия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockResponse'
        '400':
          description: Неверное количество
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/products/{id}/decrease-stock:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Уменьшить количество товара на складе
      tags:
        - Admin Products
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecreaseStock'
      responses:
        '200':
          description: Количество успешно уменьшено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecreaseStockResponse'
        '400':
          description: Неверное количество или недостаточно товара
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Admin Order Management
  /admin/orders:
    get:
      summary: Получить список всех заказов (админка)
      tags:
        - Admin Orders
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список заказов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          description: Нет доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Получить детальную информацию о заказе (админка)
      tags:
        - Admin Orders
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Заказ найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Заказ не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/orders/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Обновить статус заказа
      tags:
        - Admin Orders
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatus'
      responses:
        '200':
          description: Статус заказа успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Заказ не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/orders/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Отменить заказ
      tags:
        - Admin Orders
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Заказ успешно отменен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Заказ уже отменен или завершен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Заказ не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Admin Management
  /admin/admins:
    get:
      summary: Получить список всех администраторов
      tags:
        - Admin Management
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список администраторов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Admin'
        '401':
          description: Нет доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Создать нового администратора (только для SUPER_ADMIN)
      tags:
        - Admin Management
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdmin'
      responses:
        '201':
          description: Администратор успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        '400':
          description: Неверные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав (требуется SUPER_ADMIN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/admins/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Получить информацию об администраторе
      tags:
        - Admin Management
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Администратор найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        '404':
          description: Администратор не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Обновить информацию об администраторе (только для SUPER_ADMIN)
      tags:
        - Admin Management
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdmin'
      responses:
        '200':
          description: Администратор успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        '404':
          description: Администратор не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав (требуется SUPER_ADMIN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Удалить администратора (только для SUPER_ADMIN)
      tags:
        - Admin Management
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Администратор успешно удален
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Администратор не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав (требуется SUPER_ADMIN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

